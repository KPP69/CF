name: Update CFicon.json

on:
  push:
    branches: [main]
    paths:
      - "icon/app/*.png"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate CFicon.json
        run: |
          python3 - << 'EOF'
          import json, os
          from urllib.parse import quote
          base = "https://raw.githubusercontent.com/KPP69/CF/main/icon/app/"
          files = sorted(f for f in os.listdir("icon/app") if f.lower().endswith(".png"))
          data = {
              "name": "CFicon",
              "description": "CFicon",
              "icons": [{"name": n, "url": base + quote(n)} for n in files],
          }
          with open("icon/CFicon.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("icons:", len(files))
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icon/CFicon.json
          git diff --cached --quiet || git commit -m "auto: update CFicon.json"
          git push
